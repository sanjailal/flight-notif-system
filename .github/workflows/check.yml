name: flight-check
on:
  schedule:
    - cron: "*/15 * * * *"   # best-effort; GitHub may delay runs a few minutes
  workflow_dispatch:
permissions:
  contents: write            # to commit state.json back
concurrency:
  group: flight-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check flights
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SERPAPI_EVERY_HOURS: "24"   # 4 searches/run -> ~120/month; lower if your plan allows
        run: python check_flights.py
      - name: Save state
        run: |
          git config user.name "flight-bot"
          git config user.email "flight-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
